<div class="sheet-shell" *ngIf="workbook() as model; else loadingTpl">
  <header class="sheet-appbar" role="banner">
    <div class="sheet-appbar__left">
      <a routerLink="/" class="sheet-appbar__product" aria-label="Sheets home">
        <span class="sheet-appbar__product-logo">S</span>
        <span class="sheet-appbar__product-text">Sheets</span>
      </a>
      <div class="sheet-appbar__meta">
        <input
          class="sheet-appbar__title"
          [value]="sheetDoc()?.title ?? 'Untitled workbook'"
          (input)="handleTitleInput($event)"
        />
        <div class="sheet-appbar__status">
          <span class="status-indicator" [class.status-indicator--local]="sheetsService.syncMode === 'local'"></span>
          <span>{{ sheetsService.syncMode === 'remote' ? 'Synced' : 'Offline mode' }}</span>
          <span *ngIf="saving()">Saving…</span>
          <span *ngIf="!saving() && sheetsService.lastSavedAt">
            Saved {{ sheetsService.lastSavedAt | date: 'shortTime' }}
          </span>
        </div>
        <a routerLink="/" class="sheet-appbar__breadcrumb">All workbooks</a>
      </div>
    </div>
    <div class="sheet-appbar__right">
      <div class="sheet-appbar__icon-group" role="toolbar" aria-label="Quick actions">
        <button type="button" class="sheet-icon-btn" title="Print" (click)="onMenu('print')">⎙</button>
        <button type="button" class="sheet-icon-btn" title="Download (.xlsx)" (click)="onMenu('download-xlsx')">⬇</button>
      </div>
      <button type="button" class="sheet-share-btn" (click)="onMenu('share')">Share</button>
      <div class="sheet-avatar">U</div>
    </div>
  </header>

  <nav class="sheet-menubar" role="navigation" aria-label="Workbook menus">
    <ng-container *ngFor="let menu of contextMenus">
      <div class="sheet-menubar__item">
        <button type="button">{{ menu.name }}</button>
        <div *ngIf="menu.actions.length" class="sheet-menubar__dropdown">
          <button
            type="button"
            *ngFor="let action of menu.actions"
            (click)="onMenu(action)"
          >
            {{ labelFor(action) }}
          </button>
        </div>
      </div>
    </ng-container>
  </nav>

  <!-- Share modal -->
  <div *ngIf="shareOpen()" class="fixed inset-0 z-[70000] flex items-center justify-center bg-black/30">
    <div class="w-[520px] max-w-[95vw] rounded-xl bg-white p-4 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-semibold">Share</h3>
        <button class="text-slate-500" (click)="shareOpen.set(false)">✕</button>
      </div>
      <div class="mt-3 space-y-2">
        <div class="flex gap-2">
          <input class="flex-1 rounded border border-slate-300 px-2 py-1 text-sm" placeholder="User ID (UUID)" [ngModel]="shareUserId()" (ngModelChange)="shareUserId.set($event)" />
          <select class="rounded border border-slate-300 px-2 py-1 text-sm" [ngModel]="shareRole()" (ngModelChange)="shareRole.set($event)">
            <option value="viewer">Viewer</option>
            <option value="commenter">Commenter</option>
            <option value="editor">Editor</option>
          </select>
          <button class="rounded bg-blue-700 px-3 py-1 text-sm font-medium text-white" (click)="addCollaborator()">Add</button>
        </div>
        <div class="max-h-[240px] overflow-y-auto rounded border">
          <div *ngFor="let r of shareRows()" class="flex items-center justify-between border-b px-3 py-2 text-sm">
            <div>
              <div class="font-medium">{{ r.userId }}</div>
              <div class="text-xs text-slate-500">{{ r.role | titlecase }}</div>
            </div>
            <button class="rounded border px-2 py-1 text-xs" (click)="removeCollaborator(r.userId)">Remove</button>
          </div>
          <div *ngIf="!shareRows().length" class="px-3 py-2 text-xs text-slate-500">No collaborators yet.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-formula" role="region" aria-label="Formula editor">
    <div class="sheet-formula__label">fx</div>
    <input
      class="sheet-formula__input"
      type="text"
      spellcheck="false"
      [value]="formulaBuffer()"
      (input)="onFormulaInput($any($event.target).value)"
      (keydown)="onFormulaKeydown($event)"
    />
    <div class="sheet-formula__toolbar">
      <button
        type="button"
        class="sheet-formula__btn"
        [class.sheet-formula__btn--active]="activeFormat().bold"
        (click)="toggleBold()"
        title="Bold"
      >
        B
      </button>
      <button
        type="button"
        class="sheet-formula__btn"
        [class.sheet-formula__btn--active]="activeFormat().italic"
        (click)="toggleItalic()"
        title="Italic"
      >
        I
      </button>
      <div class="sheet-formula__divider"></div>
      <select
        class="sheet-formula__select"
        [value]="activeFormat().numberFormat ?? 'plain'"
        (change)="onNumberFormatChange($event)"
      >
        <option value="plain">Plain text</option>
        <option value="number">Number</option>
        <option value="currency">Currency (USD)</option>
        <option value="percent">Percent</option>
      </select>
    </div>
  </div>
  <div class="sheet-status-banner" *ngIf="formulaError()" aria-live="polite" role="status">
    {{ formulaError() }}
  </div>

  <nav class="sheet-tabs" role="tablist" aria-label="Sheets">
    <button
      *ngFor="let tab of model.sheets; trackBy: trackSheet"
      type="button"
      class="sheet-tabs__tab"
      [class.sheet-tabs__tab--active]="tab.id === model.activeSheetId"
      (click)="setActiveSheet(tab.id)"
      (dblclick)="renameSheet(tab.id)"
    >
      {{ tab.name }}
    </button>
    <button type="button" class="sheet-tabs__add" (click)="addSheet()">＋</button>
  </nav>

  <section class="sheet-body">
    <app-sheet-workbench
      [workbook]="model"
      [readOnly]="false"
      (workbookChange)="handleWorkbookChange($event)"
      (selectionChange)="handleSelectionChange($event)"
    ></app-sheet-workbench>
    <div *ngIf="saveError()" class="error-banner">{{ saveError() }}</div>
  </section>
</div>

<ng-template #loadingTpl>
  <div class="w-full h-full flex items-center justify-center text-slate-500">Loading workbook.</div>
</ng-template>
