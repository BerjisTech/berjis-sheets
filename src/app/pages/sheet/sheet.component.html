<div class="w-full max-w-6xl mx-auto py-4">
  <div class="flex items-center justify-between gap-3 mb-3">
    <input class="flex-1 text-2xl font-semibold outline-none bg-transparent border-b border-gray-200 focus:border-gray-400 py-1"
      placeholder="Untitled sheet" [(ngModel)]="sheet!.title" (ngModelChange)="onTitleChange()" />
    <div class="flex items-center gap-2 text-xs">
      <span class="inline-block h-2 w-2 rounded-full" [class.bg-green-500]="sheets.syncMode==='remote'" [class.bg-yellow-500]="sheets.syncMode==='local'"></span>
      <span>Sync: {{ sheets.syncMode === 'remote' ? 'Server' : 'Local' }}</span>
      <span *ngIf="sheets.isSaving" class="text-gray-500">• Saving…</span>
      <span *ngIf="!sheets.isSaving && sheets.lastSavedAt" class="text-gray-500">• Saved {{ sheets.lastSavedAt | date:'shortTime' }}</span>
      <span *ngIf="sheets.lastError" class="text-red-600">• {{ sheets.lastError }}</span>
    </div>
  </div>

  <div class="flex items-center gap-1 p-2 border rounded bg-white sticky top-0 z-10 mb-2">
    <button class="px-2 py-1 border rounded" (click)="addRow()">+ Row</button>
    <button class="px-2 py-1 border rounded" (click)="addCol()">+ Column</button>
  </div>

  <div class="overflow-auto border rounded bg-white">
    <table class="min-w-full text-sm table-fixed border-collapse">
      <thead>
        <tr>
          <th class="border px-2 py-1 bg-gray-50 w-10"></th>
          <th class="border px-2 py-1 bg-gray-50 w-24" *ngFor="let _ of (grid && grid[0] ? grid[0] : []); let ci = index">{{ colLabel(ci) }}</th>
        </tr>
      </thead>
      <tbody *ngIf="grid && grid.length">
        <tr *ngFor="let row of grid; let ri = index; trackBy: trackRow">
          <th class="border px-2 py-1 bg-gray-50 text-right w-10">{{ ri+1 }}</th>
          <td class="border p-0" *ngFor="let cell of row; let ci = index; trackBy: trackCol">
            <input class="w-full px-2 py-1 outline-none h-8"
                   [(ngModel)]="grid[ri][ci]"
                   [ngModelOptions]="{standalone: true}"
                   (ngModelChange)="queueSave()"
                   (keydown)="onCellKeydown($event, ri, ci)"
                   autocomplete="off" spellcheck="false" />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
