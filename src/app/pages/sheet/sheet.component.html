<div class="w-full h-[145px] overflow-hidden ps-[30px] p-3">
  <div class="h-[70px] flex items-center justify-start gap-3">
    <div class="h-full w-[70px] bg-blue-400 rounded flex items-center justify-center">Icon</div>
    <div class="flex-grow">
      <div class="flex items-center-safe justify-start gap-2">
        <input class="text-2xl font-semibold outline-none bg-transparent py-1" placeholder="Untitled document"
          [(ngModel)]="sheet!.title" (ngModelChange)="onTitleChange()" />

        <div class="flex items-center gap-2 text-xs">
          <span>start</span>
          <span class="inline-block h-2 w-2 rounded-full" [class.bg-green-500]="sheets.syncMode==='remote'"
            [class.bg-yellow-500]="sheets.syncMode==='local'"></span>
          <span>Sync: {{ sheets.syncMode === 'remote' ? 'Server' : 'Local' }}</span>
          <span *ngIf="sheets.isSaving" class="text-gray-500">• Saving…</span>
          <span *ngIf="!sheets.isSaving && sheets.lastSavedAt" class="text-gray-500">• Saved {{ sheets.lastSavedAt |
            date:'shortTime' }}</span>
          <span *ngIf="sheets.lastError" class="text-red-600">• {{ sheets.lastError }}</span>
        </div>
      </div>
      <div class="flex items-center justify-start">
        <span *ngFor="let contextMenu of contextMenus"
          class="group hover:bg-slate-200 px-3 rounded hover:shadow cursor-pointer relative">
          {{contextMenu.name}}
          <div
            class="hidden group-hover:block absolute top-[100%] left-0 rounded shadow bg-white z-[50000] overflow-hidden">
            <div *ngFor="let menu of contextMenu.menus" class="p-2 hover:bg-slate-200 cursor-pointer">{{menu.name}}
            </div>
          </div>
        </span>
      </div>
    </div>
    <div class="h-full flex items-center justify-end gap-2">
      <div>History</div>
      <div>Comment</div>
      <div>Share</div>
      <div>Ai</div>
      <div>User</div>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-1 p-2 rounded bg-blue-200 sticky mt-3 top-0 z-10">
    <button class="px-2 py-1 border rounded" (click)="addRow()">+ Row</button>
    <button class="px-2 py-1 border rounded" (click)="addCol()">+ Column</button>
  </div>

</div>

<div class="h-[calc(100vh-155px)] mt-2 z-[1] overflow-auto bg-white">
  <table class="min-w-full text-sm !table-fixed border-collapse">
    <thead>
      <tr>
        <th class="border py-1 bg-gray-50 w-[10px]"></th>
        <th class="border px-2 py-1 bg-gray-50 w-24" *ngFor="let _ of (grid && grid[0] ? grid[0] : []); let ci = index">
          {{ colLabel(ci) }}</th>
      </tr>
    </thead>
    <tbody *ngIf="grid && grid.length">
      <tr *ngFor="let row of grid; let ri = index; trackBy: trackRow">
        <th class="border px-2 py-1 bg-gray-50 text-right w-[10px]">{{ ri+1 }}</th>
        <td class="border p-0" *ngFor="let cell of row; let ci = index; trackBy: trackCol">
          <input class="w-full px-2 py-1 outline-none h-8" [(ngModel)]="grid[ri][ci]"
            [ngModelOptions]="{standalone: true}" (ngModelChange)="queueSave()"
            (keydown)="onCellKeydown($event, ri, ci)" autocomplete="off" spellcheck="false" />
        </td>
      </tr>
    </tbody>
  </table>
</div>
